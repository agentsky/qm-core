{{- $root := . -}}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $persistent := and $svc.persistence $svc.persistence.enabled }}
{{- if and $persistent (not $svc.dataDir) }}
{{- fail (printf "services.%s.persistence needs services.%s.dataDir to say where the volume mounts" $name $name) }}
{{- end }}
{{- if and $persistent (gt (int ($svc.replicas | default 1)) 1) }}
{{- fail (printf "services.%s.persistence keeps %s on one ReadWriteOnce volume, so replicas must be 1" $name $svc.dataDir) }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qm.fullname" $root }}-{{ $name }}
  labels:
    {{- include "qm.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $svc.replicas | default 1 }}
  {{- if $persistent }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "qm.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      annotations:
        checksum/secret-env: {{ include (print $root.Template.BasePath "/secret.yaml") $root | sha256sum }}
      labels:
        {{- include "qm.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "qm.serviceAccountName" $root }}
      {{- with $svc.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $persistent }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $svc.persistence.existingClaim | default (printf "%s-%s-data" (include "qm.fullname" $root) $name) }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $root.Values.image.repository }}{{ $root.Values.image.separator | default "/" }}{{ $svc.image }}:{{ $svc.tag | default $root.Values.image.tag | default $root.Chart.AppVersion }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          {{- with $svc.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: {{ ternary "http" "proxy" (eq $svc.type "web") }}
              containerPort: {{ $svc.port }}
          {{- $wired := dict }}
          {{- $svcHost := printf "%s-%%s.%s.svc.cluster.local" (include "qm.fullname" $root) $root.Release.Namespace }}
          {{- if eq $name "core" }}
          {{- $_ := set $wired "SESSION_STORE" "postgres" }}
          {{- $_ := set $wired "RUN_STORE" "postgres" }}
          {{- $_ := set $wired "HARNESS" "pi" }}
          {{- else }}
          {{- $_ := set $wired "CORE_API_URL" (printf "http://%s:%v" (printf $svcHost "core") (index $root.Values.services "core").port) }}
          {{- end }}
          {{- if and $persistent $svc.dataDir }}
          {{- $_ := set $wired "DATA_DIR" $svc.dataDir }}
          {{- end }}
          {{- if and $root.Values.publicUrl (eq $name "core") }}
          {{- $_ := set $wired "AGENT_API_URL" $root.Values.publicUrl }}
          {{- $_ := set $wired "PUBLIC_WEB_URL" $root.Values.publicUrl }}
          {{- end }}
          {{- $env := mergeOverwrite (deepCopy $wired) (deepCopy ($root.Values.env | default dict)) (deepCopy ($svc.env | default dict)) }}
          {{- if $env }}
          env:
            {{- range $k, $v := $env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}
          {{- if or (include "qm.hasSecretEnv" $root) $root.Values.envFrom }}
          envFrom:
            {{- if include "qm.hasSecretEnv" $root }}
            - secretRef:
                name: {{ include "qm.fullname" $root }}-env
            {{- end }}
            {{- with $root.Values.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if $svc.healthPath }}
          readinessProbe:
            httpGet:
              path: {{ $svc.healthPath }}
              port: {{ $svc.port }}
          livenessProbe:
            httpGet:
              path: {{ $svc.healthPath }}
              port: {{ $svc.port }}
          {{- else }}
          readinessProbe:
            tcpSocket:
              port: {{ $svc.port }}
          livenessProbe:
            tcpSocket:
              port: {{ $svc.port }}
          {{- end }}
          {{- with $svc.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $svc.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if $persistent }}
          volumeMounts:
            - name: data
              mountPath: {{ $svc.dataDir }}
          {{- end }}
{{- end }}
{{- end }}
